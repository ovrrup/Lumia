name: Nightly Build & Release

on:
  push:
    branches:
      - nightly
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish/Update GitHub Nightly Release'
        type: boolean
        required: false
        default: true

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release-nightly:
    name: Build & Release Nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Nightly Metadata & Version
        id: meta
        run: |
          echo "Resolving versioning info..."
          if [ -f "app/app-config.properties" ]; then
            BASE_VERSION_NAME=$(grep "VERSION_NAME=" app/app-config.properties | cut -d'=' -f2 | tr -d '\r' | xargs)
            BASE_VERSION_CODE=$(grep "VERSION_CODE=" app/app-config.properties | cut -d'=' -f2 | tr -d '\r' | xargs)
            APP_ID=$(grep "APPLICATION_ID=" app/app-config.properties | cut -d'=' -f2 | tr -d '\r' | xargs)
          fi

          if [ -z "$BASE_VERSION_NAME" ]; then BASE_VERSION_NAME="1.0.0"; fi
          if [ -z "$BASE_VERSION_CODE" ]; then BASE_VERSION_CODE="1"; fi
          if [ -z "$APP_ID" ]; then APP_ID="lumia.tracker"; fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d")
          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
          NIGHTLY_TAG="nightly"
          NIGHTLY_TITLE="Lumia Nightly (${BUILD_DATE} - ${SHORT_SHA})"

          echo "BASE_VERSION_NAME=$BASE_VERSION_NAME" >> $GITHUB_ENV
          echo "BASE_VERSION_CODE=$BASE_VERSION_CODE" >> $GITHUB_ENV
          echo "APP_ID=$APP_ID" >> $GITHUB_ENV
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "NIGHTLY_TAG=$NIGHTLY_TAG" >> $GITHUB_ENV
          echo "NIGHTLY_TITLE=$NIGHTLY_TITLE" >> $GITHUB_ENV

          echo "----------------------------------------"
          echo "Nightly Build Configuration:"
          echo "  Application ID : $APP_ID"
          echo "  Base Version   : $BASE_VERSION_NAME (Build $BASE_VERSION_CODE)"
          echo "  Commit SHA     : $SHORT_SHA"
          echo "  Build Date     : $BUILD_DATE"
          echo "  Release Tag    : $NIGHTLY_TAG"
          echo "  Release Title  : $NIGHTLY_TITLE"
          echo "----------------------------------------"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Remove invalid macOS Icon files
        run: find app/src/main/res -type f -name "Icon*" -delete

      - name: Setup Signing Keystore
        id: keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding keystore from KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "IS_CUSTOM_KEY=true" >> $GITHUB_ENV
          elif [ -n "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo "Decoding keystore from RELEASE_KEYSTORE..."
            echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 --decode > my-upload-key.jks
            echo "IS_CUSTOM_KEY=true" >> $GITHUB_ENV
          else
            echo "No custom release keystore secret found. Generating automated nightly keystore..."
            keytool -genkeypair -v -keystore my-upload-key.jks -alias lumia-nightly -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "lumianightly" -keypass "lumianightly" \
              -dname "CN=Lumia Nightly, OU=Engineering, O=Lumia, L=OpenSource, S=Global, C=US"
            echo "KEYSTORE_PASSWORD=lumianightly" >> $GITHUB_ENV
            echo "KEY_PASSWORD=lumianightly" >> $GITHUB_ENV
            echo "ALIAS=lumia-nightly" >> $GITHUB_ENV
            echo "KEY_ALIAS=lumia-nightly" >> $GITHUB_ENV
            echo "IS_CUSTOM_KEY=false" >> $GITHUB_ENV
          fi

      - name: Build Technical Release APKs (With True AOD)
        run: |
          gradle assembleRelease assembleReleaseCompressed \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m" \
            -Dkotlin.compiler.execution.strategy=in-process \
            --no-parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          STORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS || env.ALIAS || secrets.ALIAS || 'upload' }}
          ALIAS: ${{ env.KEY_ALIAS || env.ALIAS || secrets.ALIAS || 'upload' }}

      - name: Organize Technical APKs
        run: |
          mkdir -p dist/technical
          
          # Rename standard uncompressed technical APKs
          if [ -d "app/build/outputs/apk/release" ]; then
            cd app/build/outputs/apk/release
            for file in *.apk; do
              if [ -f "$file" ]; then
                new_name=$(echo "$file" | sed -e 's/^app/Lumia-technical-nightly/' -e 's/-release//')
                cp "$file" "../../../../../dist/technical/$new_name"
                echo "Processed Technical APK: $new_name"
              fi
            done
            cd ../../../../../
          fi

          # Rename compressed technical APKs
          if [ -d "app/build/outputs/apk/releaseCompressed" ]; then
            cd app/build/outputs/apk/releaseCompressed
            if [ -f "app-releaseCompressed-universal.apk" ]; then
              cp app-releaseCompressed-universal.apk "../../../../../dist/technical/Lumia-technical-nightly-universal-compressed.apk"
              echo "Processed Technical Compressed APK"
            fi
            cd ../../../../../
          fi

          # Ensure generic universal alias
          if [ -f "dist/technical/Lumia-technical-nightly-universal.apk" ]; then
            cp "dist/technical/Lumia-technical-nightly-universal.apk" "dist/technical/Lumia-technical-nightly.apk"
          fi

          echo "Technical APKs directory:"
          ls -la dist/technical/

      - name: Clean Gradle Build Cache for Standard Flavor
        run: gradle clean

      - name: Strip True AOD Feature (For Standard Flavor)
        run: |
          # Remove SYSTEM_ALERT_WINDOW permission
          sed -i '/android.permission.SYSTEM_ALERT_WINDOW/d' app/src/main/AndroidManifest.xml
          # Remove AodAccessibilityService declaration from AndroidManifest
          perl -0777 -pi -e 's/<service[^>]*AodAccessibilityService.*?<\/service>//gs' app/src/main/AndroidManifest.xml

      - name: Build Standard Release APKs (No AOD / Clean FOSS)
        run: |
          gradle assembleRelease assembleReleaseCompressed \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=1024m" \
            -Dkotlin.compiler.execution.strategy=in-process \
            --no-parallel
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          STORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS || env.ALIAS || secrets.ALIAS || 'upload' }}
          ALIAS: ${{ env.KEY_ALIAS || env.ALIAS || secrets.ALIAS || 'upload' }}

      - name: Organize Standard APKs & Consolidate Deliverables
        run: |
          mkdir -p dist/standard
          mkdir -p dist/all-apks

          # Rename standard uncompressed APKs
          if [ -d "app/build/outputs/apk/release" ]; then
            cd app/build/outputs/apk/release
            for file in *.apk; do
              if [ -f "$file" ]; then
                new_name=$(echo "$file" | sed -e 's/^app/Lumia-nightly/' -e 's/-release//')
                cp "$file" "../../../../../dist/standard/$new_name"
                echo "Processed Standard APK: $new_name"
              fi
            done
            cd ../../../../../
          fi

          # Rename compressed APKs
          if [ -d "app/build/outputs/apk/releaseCompressed" ]; then
            cd app/build/outputs/apk/releaseCompressed
            if [ -f "app-releaseCompressed-universal.apk" ]; then
              cp app-releaseCompressed-universal.apk "../../../../../dist/standard/Lumia-nightly-universal-compressed.apk"
              echo "Processed Standard Compressed APK"
            fi
            cd ../../../../../
          fi

          # Ensure generic universal alias
          if [ -f "dist/standard/Lumia-nightly-universal.apk" ]; then
            cp "dist/standard/Lumia-nightly-universal.apk" "dist/standard/Lumia-nightly.apk"
          fi

          # Consolidate all APKs into dist/all-apks
          cp dist/standard/*.apk dist/all-apks/
          cp dist/technical/*.apk dist/all-apks/

          echo "Consolidated deliverables in dist/all-apks/:"
          ls -la dist/all-apks/

      - name: Generate Checksums & Changelog Release Description
        id: release_notes
        run: |
          echo "Generating checksums and detailed release notes..."

          cd dist/all-apks
          touch checksums.sha256
          for file in *.apk; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> checksums.sha256
            fi
          done
          cd ../../

          # Generate Recent Git Commit Log (last 15 commits)
          COMMIT_LOG=$(git log -n 15 --pretty=format:"- [%h] %s (%an)" --no-merges)

          cat <<EOF > NIGHTLY_RELEASE_NOTES.md
          ## 🌙 Lumia Nightly Build (\`${{ env.BUILD_DATE }}\`)

          Welcome to the automated **Nightly Channel** for **Lumia**. This rolling pre-release contains the latest cutting-edge features, UI refinements, performance enhancements, and bug fixes directly from the \`nightly\` branch.

          > ⚠️ **Nightly Advisory:** Nightly builds are built automatically from active development. While tested for stability, some experimental features may undergo rapid changes.

          ---

          ### 📦 Build Metadata
          - **Commit:** [\`${{ env.SHORT_SHA }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **Build Timestamp:** \`${{ env.BUILD_TIME }}\`
          - **Application ID:** \`${{ env.APP_ID }}\`
          - **Base Version:** \`v${{ env.BASE_VERSION_NAME }}\` (Build \`${{ env.BASE_VERSION_CODE }}\`)

          ---

          ### 🚀 Which APK Should I Download?

          | Flavor | Target Architecture | Description | Download |
          | :--- | :--- | :--- | :--- |
          | **Standard (Recommended)** | Universal (All Devices) | Standard battery-efficient build without background accessibility overlay | [\`Lumia-nightly.apk\`](https://github.com/${{ github.repository }}/releases/download/nightly/Lumia-nightly.apk) |
          | **Standard** | \`arm64-v8a\` | Optimized for modern 64-bit Android smartphones | [\`Lumia-nightly-arm64-v8a.apk\`](https://github.com/${{ github.repository }}/releases/download/nightly/Lumia-nightly-arm64-v8a.apk) |
          | **Standard** | \`armeabi-v7a\` | 32-bit ARM legacy support | [\`Lumia-nightly-armeabi-v7a.apk\`](https://github.com/${{ github.repository }}/releases/download/nightly/Lumia-nightly-armeabi-v7a.apk) |
          | **Standard** | \`x86_64\` | Emulators, Android PCs & Intel/AMD architecture | [\`Lumia-nightly-x86_64.apk\`](https://github.com/${{ github.repository }}/releases/download/nightly/Lumia-nightly-x86_64.apk) |
          | **Technical** | Universal | Enhanced edition with **True AOD** & custom system overlay features | [\`Lumia-technical-nightly.apk\`](https://github.com/${{ github.repository }}/releases/download/nightly/Lumia-technical-nightly.apk) |
          | **Technical** | \`arm64-v8a\` | 64-bit edition with True AOD capabilities | [\`Lumia-technical-nightly-arm64-v8a.apk\`](https://github.com/${{ github.repository }}/releases/download/nightly/Lumia-technical-nightly-arm64-v8a.apk) |

          ---

          ### 📝 Recent Changes & Commits
          ${COMMIT_LOG}

          ---

          ### 🔒 Integrity Verification (SHA-256 Checksums)

          \`\`\`
          $(cat dist/all-apks/checksums.sha256)
          \`\`\`

          ---
          *Built automatically by GitHub Actions with Temurin JDK 17 & Gradle.*
          EOF

          echo "Generated NIGHTLY_RELEASE_NOTES.md preview:"
          cat NIGHTLY_RELEASE_NOTES.md

      - name: Upload Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Lumia-Nightly-Build-${{ env.SHORT_SHA }}
          path: |
            dist/all-apks/*.apk
            dist/all-apks/checksums.sha256
          retention-days: 14

      - name: Update or Create Rolling Nightly Release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NIGHTLY_TAG }}
          name: ${{ env.NIGHTLY_TITLE }}
          body_path: NIGHTLY_RELEASE_NOTES.md
          prerelease: true
          draft: false
          make_latest: false
          files: |
            dist/all-apks/*.apk
            dist/all-apks/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
